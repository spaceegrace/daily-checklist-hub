<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Pod 🐸</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="backupBanner" class="backup-banner">
        <span>🛡️ Ribbit! Remember to download a backup to keep your achievements safe! 🐸</span>
        <button id="bannerClose" class="btn-close-banner">×</button>
    </div>

    <div class="container">
        <header class="header">
            <h1>Progress Pod 🐸</h1>
            <p class="date" id="currentDate"></p>
        </header>

        <!-- Dynamic Lily Pad GIF -->
        <div class="lily-pad-container">
            <img src="https://giphy.com" 
                 id="growingLilyPad" 
                 class="lily-pad-gif" 
                 alt="Growing Lily Pad">
        </div>

        <main class="centered-content">
            <section class="goal-card daily-section">
                <div class="section-header">
                    <h2>Today's Hops</h2>
                    <div class="progress-wrap">
                        <div class="progress-bar"><div class="progress-fill" id="dailyProgress"></div></div>
                        <span id="dailyProgressText">0%</span>
                    </div>
                </div>
                <div class="input-group">
                    <input type="text" id="dailyInput" class="goal-input" placeholder="Next daily hop...">
                    <button class="btn btn-primary" id="addDailyBtn">Add Hop</button>
                </div>
                <ul class="goals-list" id="dailyList"></ul>
            </section>

            <section class="goal-card">
                <h3>🍄 Monthly</h3>
                <div class="input-group">
                    <input type="text" id="monthlyInput" class="goal-input" placeholder="Monthly hop...">
                    <button class="btn btn-primary" id="addMonthlyBtn">+</button>
                </div>
                <ul class="goals-list" id="monthlyList"></ul>
            </section>

            <section class="goal-card">
                <h3>🌿 Yearly</h3>
                <div class="input-group">
                    <input type="text" id="yearlyInput" class="goal-input" placeholder="Yearly hop...">
                    <button class="btn btn-primary" id="addYearlyBtn">+</button>
                </div>
                <ul class="goals-list" id="yearlyList"></ul>
            </section>
        </main>
    </div>

    <footer class="history-footer collapsed" id="historyFooter">
        <div class="history-header" id="historyToggle">
            <div class="history-title-group">
                <h3>Progress Pod <span id="historyChevron">▼</span></h3>
                <button id="clearHistoryBtn" class="btn-util">Clear All</button>
            </div>
            <div class="data-mgmt">
                <button id="exportBtn" class="btn-util">Backup</button>
                <label for="importFile" class="btn-util" role="button" tabindex="0">Restore</label>
                <input type="file" id="importFile" accept=".json" style="display:none;">
            </div>
        </div>
        
        <div class="history-content" id="historyContent">
            <!-- Left Column: History Lists -->
            <div class="history-col-left">
                <div class="hist-sub"><h4>Daily</h4><div id="dailyHistoryList"></div></div>
                <div class="hist-sub"><h4>Monthly</h4><div id="monthlyHistoryList"></div></div>
                <div class="hist-sub"><h4>Yearly</h4><div id="yearlyHistoryList"></div></div>
            </div>
            <!-- Right Column: Streak -->
            <div class="history-col-right">
                <div class="streak-box">
                    <h4>🔥 Current Streak</h4>
                    <span id="streakCount">0</span>
                    <small>Consecutive Days</small>
                </div>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
