<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Pond 🐸</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="backupBanner" class="backup-banner">
        <span>✨ Ribbit! Remember to backup your hops to keep them safe! 🌸</span>
        <button id="bannerClose" class="btn-close-banner">×</button>
    </div>

    <!-- Side Drawer Toggle -->
    <button id="drawerToggle" class="drawer-toggle" title="Health & Mood">🐸</button>

    <!-- Side Drawer (Mood & Water) -->
    <aside id="sideDrawer" class="side-drawer">
        <button id="drawerClose" class="drawer-close">×</button>
        <div class="drawer-content">
            <div class="drawer-group">
                <p>How are you feeling?</p>
                <div class="mood-options">
                    <button class="mood-btn" data-mood="happy">😊</button>
                    <button class="mood-btn" data-mood="calm">😌</button>
                    <button class="mood-btn" data-mood="focused">🧐</button>
                    <button class="mood-btn" data-mood="tired">😴</button>
                </div>
            </div>
            <div class="drawer-group">
                <p>Hydration 💧</p>
                <div class="droplet-container">
                    <button class="drop-btn" data-index="0">💧</button>
                    <button class="drop-btn" data-index="1">💧</button>
                    <button class="drop-btn" data-index="2">💧</button>
                    <button class="drop-btn" data-index="3">💧</button>
                </div>
            </div>
        </div>
    </aside>

    <div class="container">
        <header class="header">
            <h1>✨ Progress Pond ✨</h1>
            <p id="currentDate" class="date-display"></p>
        </header>

        <main class="main-stack">
            <section class="pond-card">
                <div class="card-header">
                    <h2>Daily Hops 🌿</h2>
                    <div class="progress-info">
                        <div class="progress-bar"><div id="dailyProgress" class="progress-fill"></div></div>
                        <span id="dailyProgressText">0%</span>
                    </div>
                </div>
                <div class="input-row">
                    <input type="text" id="dailyInput" placeholder="Add a new hop..." autocomplete="off">
                    <button id="addDailyBtn" class="btn-pond">Add Hop 🌸</button>
                </div>
                <ul id="dailyList" class="hops-list"></ul>
            </section>

            <section class="pond-card">
                <h3>Monthly 🍄</h3>
                <div class="input-row">
                    <input type="text" id="monthlyInput" placeholder="Monthly goal...">
                    <button id="addMonthlyBtn" class="btn-pond">+</button>
                </div>
                <ul id="monthlyList" class="hops-list"></ul>
            </section>
        </main>
    </div>

    <!-- Achievement Bar -->
    <footer id="historyFooter" class="achievement-bar collapsed">
        <div class="bar-header">
            <div class="centered-controls">
                <button id="historyToggle" class="btn-util">Achievement Bar ▼</button>
                <button id="clearHistoryBtn" class="btn-util">Clear All</button>
                <button id="exportBtn" class="btn-util">Backup</button>
                <label for="importFile" class="btn-util" role="button">Restore</label>
                <input type="file" id="importFile" accept=".json" style="display:none;">
            </div>
        </div>
        
        <div class="achievement-content">
            <div class="achieve-left">
                <h4>Goal History</h4>
                <div id="moodHistoryList" class="history-list"></div>
            </div>
            <div class="achieve-right">
                <h4>Progress Streak</h4>
                <div class="streak-box">
                    <span id="streakCount">0</span>
                    <small>Day Streak</small>
                </div>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
