<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Progress Pond V23 🐸</title>
    <!-- Link to Chart.js Library -->
    <script src="
    https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js
    "></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Motivation Banner -->
    <div id="motivationBar" class="motivation-bar">
        <span id="motivationText"></span>
        <button id="bannerClose" class="btn-close-banner" aria-label="Dismiss">×</button>
    </div>

    <div class="container">
        <header class="header">
            <h1>✨ Progress Pond ✨</h1>
            <p id="currentDate" class="date-display"></p>
        </header>

        <main class="main-stack">
            <!-- NEW: Trend Graph Section -->
            <section class="pond-card trend-card">
                <h2>Pond Trends 📈</h2>
                <div class="chart-container">
                    <canvas id="healthChart"></canvas>
                </div>
            </section>

            <!-- Mood Tracker -->
            <section class="pond-card">
                <h2>How are you feeling? 🐸</h2>
                <div class="mood-options">
                    <button class="mood-btn" data-mood="Happy">😊</button>
                    <button class="mood-btn" data-mood="Calm">😌</button>
                    <button class="mood-btn" data-mood="Focused">🧐</button>
                    <button class="mood-btn" data-mood="Tired">😴</button>
                    <button class="mood-btn" data-mood="Grumpy">😠</button>
                    <button class="mood-btn" data-mood="Confused">😕</button>
                    <button class="mood-btn" data-mood="Angry">😡</button>
                    <button class="mood-btn" data-mood="Sad">😢</button>
                    <button class="mood-btn" data-mood="Crying">😭</button>
                    <button class="mood-btn" data-mood="Manic">🤪</button>
                </div>
            </section>

            <!-- Stats Tracker -->
            <section class="pond-card">
                <div class="card-header">
                    <h2>Stats Tracker 🩸🥣</h2>
                    <input type="time" id="manualTimeInput" class="time-picker">
                </div>
                <div class="input-row">
                    <input type="number" id="sugarInput" placeholder="mg/dL">
                    <button id="addSugarBtn" class="btn-pond">Log Glucose</button>
                </div>
                <div class="input-row">
                    <input type="number" id="carbInput" placeholder="Grams carbs">
                    <button id="addCarbBtn" class="btn-pond">Log Carbs</button>
                </div>
            </section>

            <!-- Hydration -->
            <section class="pond-card">
                <div class="card-header">
                    <h2>Hydration 💧</h2>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span id="waterCountText" class="count-badge">0 / 8</span>
                        <button id="clearWaterBtn" class="btn-util" style="background: var(--pink); border: 1px solid white; color: white;">Clear</button>
                    </div>
                </div>
                <div class="droplet-container">
                    <button class="drop-btn">💧</button><button class="drop-btn">💧</button>
                    <button class="drop-btn">💧</button><button class="drop-btn">💧</button>
                    <button class="drop-btn">💧</button><button class="drop-btn">💧</button>
                    <button class="drop-btn">💧</button><button class="drop-btn">💧</button>
                </div>
            </section>

            <!-- Daily Hops -->
            <section class="pond-card">
                <div class="card-header">
                    <h2>Daily Hops 🌿</h2>
                    <div class="progress-wrap">
                        <div class="progress-bar"><div id="dailyProgress" class="progress-fill"></div></div>
                        <span id="dailyProgressText">0%</span>
                    </div>
                </div>
                <div class="input-stack">
                    <div class="input-row">
                        <input type="text" id="dailyInput" placeholder="Next hop...">
                        <select id="priorityInput" class="priority-select">
                            <option value="Low">Low 🌱</option>
                            <option value="Medium" selected>Med 🌿</option>
                            <option value="High">High 🔥</option>
                        </select>
                    </div>
                    <button id="addDailyBtn" class="btn-pond full-width">Add Hop</button>
                </div>
                <ul id="dailyList" class="hops-list"></ul>
            </section>
        </main>
    </div>

    <!-- Achievement Bar (Footer) -->
    <footer id="historyFooter" class="achievement-bar collapsed">
        <div class="bar-header">
            <div class="centered-controls">
                <button id="historyToggle" class="btn-util">Achievements ▼</button>
                <button id="clearHistoryBtn" class="btn-util">Clear All</button>
                <button id="resetPondBtn" class="btn-util">Reset Day</button>
            </div>
        </div>
        <div class="achievement-content">
            <div class="achieve-col">
                <h4>Hops History</h4>
                <div id="dailyHistoryList" class="history-list"></div>
            </div>
            <div class="achieve-col">
                <h4>Health & Mood Log</h4>
                <div id="moodHistoryList" class="history-list"></div>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
