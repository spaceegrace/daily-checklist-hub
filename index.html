<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Pond 🐸</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="backupBanner" class="backup-banner">
        <span>✨ Ribbit! Remember to backup your pond data! 🌸</span>
        <button id="bannerClose" class="btn-close-banner">×</button>
    </div>

    <div class="container">
        <header class="header">
            <h1>✨ Progress Pond ✨</h1>
            <p id="currentDate" class="date-display"></p>
        </header>

        <main class="main-stack">
            <!-- 1. Mood Tracker (Multiple entries allowed) -->
            <section class="pond-card">
                <div class="card-header">
                    <h2>How are you feeling? 🐸</h2>
                </div>
                <div class="mood-options">
                    <button class="mood-btn" data-mood="Happy">😊</button>
                    <button class="mood-btn" data-mood="Calm">😌</button>
                    <button class="mood-btn" data-mood="Focused">🧐</button>
                    <button class="mood-btn" data-mood="Tired">😴</button>
                    <button class="mood-btn" data-mood="Grumpy">😠</button>
                </div>
            </section>

            <!-- 2. Water Intake -->
            <section class="pond-card">
                <div class="card-header">
                    <h2>Hydration 💧</h2>
                    <span id="waterCountText" class="count-badge">0 / 8 glasses</span>
                </div>
                <div class="droplet-container" id="dropletContainer">
                    <button class="drop-btn" data-index="0">💧</button>
                    <button class="drop-btn" data-index="1">💧</button>
                    <button class="drop-btn" data-index="2">💧</button>
                    <button class="drop-btn" data-index="3">💧</button>
                    <button class="drop-btn" data-index="4">💧</button>
                    <button class="drop-btn" data-index="5">💧</button>
                    <button class="drop-btn" data-index="6">💧</button>
                    <button class="drop-btn" data-index="7">💧</button>
                </div>
            </section>

            <!-- 3. Daily Hops -->
            <section class="pond-card">
                <div class="card-header">
                    <h2>Daily Hops 🌿</h2>
                    <div class="progress-info">
                        <div class="progress-bar"><div id="dailyProgress" class="progress-fill"></div></div>
                        <span id="dailyProgressText">0%</span>
                    </div>
                </div>
                <div class="input-row">
                    <input type="text" id="dailyInput" placeholder="Add a new hop..." autocomplete="off">
                    <button id="addDailyBtn" class="btn-pond">Add Hop 🌸</button>
                </div>
                <ul id="dailyList" class="hops-list"></ul>
            </section>
        </main>
    </div>

    <!-- Collapsible Achievement Bar -->
    <footer id="historyFooter" class="achievement-bar collapsed">
        <div class="bar-header">
            <div class="centered-controls">
                <button id="historyToggle" class="btn-util">Achievements ▼</button>
                <button id="clearHistoryBtn" class="btn-util">Clear All</button>
                <button id="exportBtn" class="btn-util">Backup</button>
                <label for="importFile" class="btn-util">Restore</label>
                <input type="file" id="importFile" accept=".json" style="display:none;">
            </div>
        </div>
        
        <div class="achievement-content">
            <div class="achieve-left">
                <h4>Today's Log</h4>
                <div id="dailyHistoryList" class="history-list"></div>
            </div>
            <div class="achieve-right">
                <h4>Mood & Water History</h4>
                <div id="moodHistoryList" class="history-list"></div>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
