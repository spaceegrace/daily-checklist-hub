<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Froggie Goals Hub 🐸</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="backupBanner" class="backup-banner">
        <span>🌸 Ribbit! Remember to download a backup to keep your achievements safe! 🐸</span>
        <button id="bannerClose" class="btn-close-banner">×</button>
    </div>

    <div class="container">
        <header class="header">
            <h1>✨ 🐸 Froggie Goals Hub 🐸 ✨</h1>
            <p class="date" id="currentDate"></p>
        </header>

        <!-- Growing Lily Pad Animation -->
        <div class="pond-area">
            <div id="magicLilyPad" class="lily-pad-visual">🐸</div>
        </div>

        <main class="main-content">
            <!-- Center Section -->
            <section class="daily-goals">
                <div class="section-header">
                    <h2>🐸 Today's Hops</h2>
                    <div class="progress-container">
                        <div class="progress-bar"><div class="progress-fill" id="dailyProgress"></div></div>
                        <span class="progress-text" id="dailyProgressText">0%</span>
                    </div>
                </div>
                <div class="input-group">
                    <input type="text" id="dailyInput" class="goal-input" placeholder="New hop for today..." autocomplete="off">
                    <button class="btn btn-primary" id="addDailyBtn">Add Hop 🌸</button>
                </div>
                <ul class="goals-list" id="dailyList"></ul>
            </section>

            <!-- Right Sidebar -->
            <aside class="sidebar">
                <section class="monthly-goals">
                    <h3>🍄 Monthly</h3>
                    <div class="input-group compact">
                        <input type="text" id="monthlyInput" class="goal-input" placeholder="Monthly goal...">
                        <button class="btn btn-primary compact" id="addMonthlyBtn">+</button>
                    </div>
                    <ul class="goals-list compact" id="monthlyList"></ul>
                </section>

                <section class="yearly-goals">
                    <h3>🌿 Yearly</h3>
                    <div class="input-group compact">
                        <input type="text" id="yearlyInput" class="goal-input" placeholder="Yearly goal...">
                        <button class="btn btn-primary compact" id="addYearlyBtn">+</button>
                    </div>
                    <ul class="goals-list compact" id="yearlyList"></ul>
                </section>
            </aside>
        </main>
    </div>

    <!-- Centered Collapsible History -->
    <div class="history-footer collapsed" id="historyFooter">
        <div class="history-header" id="historyToggle">
            <div class="history-title-group">
                <h3>👑 Achievement Pond <span id="historyChevron">▼</span></h3>
                <button id="clearHistoryBtn" class="btn-text-only">Clear All</button>
            </div>
            <div class="data-mgmt">
                <button id="exportBtn" class="btn-data">💾 Backup</button>
                <label for="importFile" class="btn-data">📂 Restore</label>
                <input type="file" id="importFile" accept=".json" style="display:none;">
            </div>
        </div>
        
        <div class="history-content" id="historyContent">
            <div class="history-section">
                <h4>Daily Hops</h4>
                <div id="dailyHistoryList" class="history-grid"></div>
            </div>
            <div class="history-section">
                <h4>Monthly Hops</h4>
                <div id="monthlyHistoryList" class="history-grid"></div>
            </div>
            <div class="history-section">
                <h4>Yearly Hops</h4>
                <div id="yearlyHistoryList" class="history-grid"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
