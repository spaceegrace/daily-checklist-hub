<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Goals Hub</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📋 Daily Goals Hub</h1>
            <p class="date" id="currentDate"></p>
        </header>

        <main class="main-content">
            <!-- Daily Goals Section -->
            <section class="daily-goals">
                <div class="section-header">
                    <h2>🎯 Today's Goals</h2>
                    <div class="progress-container">
                        <div class="progress-bar"><div class="progress-fill" id="dailyProgress"></div></div>
                        <span class="progress-text" id="dailyProgressText">0%</span>
                    </div>
                </div>
                <div class="input-group">
                    <input type="text" id="dailyInput" class="goal-input" placeholder="Add a new daily goal..." autocomplete="off">
                    <button class="btn btn-primary" id="addDailyBtn">+ Add Goal</button>
                </div>
                <ul class="goals-list" id="dailyList"></ul>
            </section>

            <!-- Sidebar -->
            <aside class="sidebar">
                <section class="monthly-goals">
                    <div class="section-header">
                        <h3>📆 Monthly</h3>
                        <div class="mini-progress">
                            <div class="mini-progress-bar"><div class="mini-progress-fill" id="monthlyProgress"></div></div>
                            <span id="monthlyProgressText" class="progress-percent">0%</span>
                        </div>
                    </div>
                    <div class="input-group compact">
                        <input type="text" id="monthlyInput" class="goal-input" placeholder="Monthly goal...">
                        <button class="btn btn-primary compact" id="addMonthlyBtn">+</button>
                    </div>
                    <ul class="goals-list compact" id="monthlyList"></ul>
                </section>

                <section class="yearly-goals">
                    <div class="section-header">
                        <h3>🎯 Yearly</h3>
                        <div class="mini-progress">
                            <div class="mini-progress-bar"><div class="mini-progress-fill" id="yearlyProgress"></div></div>
                            <span id="yearlyProgressText" class="progress-percent">0%</span>
                        </div>
                    </div>
                    <div class="input-group compact">
                        <input type="text" id="yearlyInput" class="goal-input" placeholder="Yearly goal...">
                        <button class="btn btn-primary compact" id="addYearlyBtn">+</button>
                    </div>
                    <ul class="goals-list compact" id="yearlyList"></ul>
                </section>
            </aside>
        </main>
    </div>

    <!-- Collapsible History Footer -->
    <div class="history-footer collapsed" id="historyFooter">
        <div class="history-header" id="historyToggle">
            <div class="history-title-group">
                <h3>🏆 Achievement History <span id="historyChevron">▼</span></h3>
                <button id="clearHistoryBtn" class="btn-text-only">Clear All History</button>
            </div>
            <div class="data-mgmt">
                <button id="exportBtn" class="btn-data">💾 Backup</button>
                <label for="importFile" class="btn-data">📂 Restore</label>
                <input type="file" id="importFile" accept=".json" style="display:none;">
            </div>
        </div>
        
        <div class="history-content" id="historyContent">
            <div class="history-section">
                <h4>Daily Achievements</h4>
                <div id="dailyHistoryList" class="history-grid"></div>
            </div>
            <div class="history-section">
                <h4>Monthly Achievements</h4>
                <div id="monthlyHistoryList" class="history-grid"></div>
            </div>
            <div class="history-section">
                <h4>Yearly Achievements</h4>
                <div id="yearlyHistoryList" class="history-grid"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
