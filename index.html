<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Progress Pond 🐸</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Centered Motivation Banner -->
    <div id="motivationBar" class="motivation-bar">
        <span id="motivationText">🐸 💖 Ribbit! You're doing amazing! ✨ 🐸</span>
        <button id="bannerClose" class="btn-close-banner">×</button>
    </div>

    <div class="container">
        <header class="header">
            <h1>✨ Progress Pond ✨</h1>
            <p id="currentDate" class="date-display"></p>
        </header>

        <main class="main-stack">
            <!-- Mood Tracker -->
            <section class="pond-card">
                <h2>How are you feeling? 🐸</h2>
                <div class="mood-options">
                    <button class="mood-btn" data-mood="Happy">😊</button>
                    <button class="mood-btn" data-mood="Calm">😌</button>
                    <button class="mood-btn" data-mood="Focused">🧐</button>
                    <button class="mood-btn" data-mood="Tired">😴</button>
                    <button class="mood-btn" data-mood="Grumpy">😠</button>
                </div>
            </section>

            <!-- Hydration -->
            <section class="pond-card">
                <div class="card-header">
                    <h2>Hydration 💧</h2>
                    <span id="waterCountText" class="count-badge">0 / 8</span>
                </div>
                <div class="water-grid">
                    <div class="droplet-row">
                        <button class="drop-btn">💧</button>
                        <button class="drop-btn">💧</button>
                        <button class="drop-btn">💧</button>
                        <button class="drop-btn">💧</button>
                    </div>
                    <div class="droplet-row">
                        <button class="drop-btn">💧</button>
                        <button class="drop-btn">💧</button>
                        <button class="drop-btn">💧</button>
                        <button class="drop-btn">💧</button>
                    </div>
                </div>
            </section>

            <!-- Daily Hops -->
            <section class="pond-card">
                <div class="card-header">
                    <h2>Daily Hops 🌿</h2>
                    <div class="progress-wrap">
                        <div class="progress-bar"><div id="dailyProgress" class="progress-fill"></div></div>
                        <span id="dailyProgressText">0%</span>
                    </div>
                </div>
                <div class="input-row">
                    <input type="text" id="dailyInput" placeholder="Next hop..." autocomplete="off">
                    <button id="addDailyBtn" class="btn-pond">Add</button>
                </div>
                <ul id="dailyList" class="hops-list"></ul>
            </section>
        </main>
    </div>

    <!-- Collapsible Achievement Bar -->
    <footer id="historyFooter" class="achievement-bar collapsed">
        <div class="bar-header">
            <div class="centered-controls">
                <button id="historyToggle" class="btn-util">Achievements ▼</button>
                <button id="resetPondBtn" class="btn-util">Reset</button>
                <button id="clearHistoryBtn" class="btn-util">Clear</button>
            </div>
        </div>
        <div class="achievement-content">
            <div class="achieve-col streak-section">
                <h4>🔥 Daily Streak</h4>
                <div class="streak-badge">
                    <span id="streakCount">0</span>
                    <small>Days</small>
                </div>
            </div>
            <div class="achieve-col">
                <h4>Hops Log</h4>
                <div id="dailyHistoryList" class="history-list"></div>
            </div>
            <div class="achieve-col">
                <h4>Mood & Water</h4>
                <div id="moodHistoryList" class="history-list"></div>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
